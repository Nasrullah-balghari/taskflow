@if (isOpen()) {
  <div class="modal-backdrop" (click)="onCancel()">
    <div class="modal-container" (click)="$event.stopPropagation()"
         role="alertdialog" aria-modal="true">

      <div class="icon-wrapper">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </div>

      <h2>Delete this category?</h2>

      <p>
        Are you sure you want to delete
        <strong>"{{ categoryName() }}"</strong>?
      </p>

      @if (affectedTaskCount() > 0) {
        <div class="warning-banner">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span>
            {{ affectedTaskCount() }}
            {{ affectedTaskCount() === 1 ? 'task' : 'tasks' }}
            will become uncategorized
          </span>
        </div>
      }

      <p class="hint">This action cannot be undone.</p>

      <div class="actions">
        <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="button" class="btn-danger"    (click)="onConfirm()">Delete Category</button>
      </div>

    </div>
  </div>
}
