<div class="board-card"
     [class.card-done]="task().completed"
     (click)="onCardClick()">

  <!-- Drag handle -->
  <div class="drag-handle" (click)="$event.stopPropagation()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <circle cx="9"  cy="6"  r="1.5"/>
      <circle cx="9"  cy="12" r="1.5"/>
      <circle cx="9"  cy="18" r="1.5"/>
      <circle cx="15" cy="6"  r="1.5"/>
      <circle cx="15" cy="12" r="1.5"/>
      <circle cx="15" cy="18" r="1.5"/>
    </svg>
  </div>

  <!-- Priority strip -->
  <div class="priority-strip" [attr.data-priority]="task().priority"></div>

  <!-- Card body -->
  <div class="card-body">
    <h4 class="card-title">{{ task().title }}</h4>

    @if (task().description) {
      <p class="card-description">{{ task().description }}</p>
    }

    <div class="card-footer">
      @if (categoryName()) {
        <span class="cat-badge"
              [style.background]="categoryColor() + '22'"
              [style.color]="categoryColor()">
          {{ categoryName() }}
        </span>
      }

      <span class="card-priority" [attr.data-priority]="task().priority">
        {{ task().priority | titlecase }}
      </span>

      @if (task().dueDate) {
        <span class="card-date" [class.date-overdue]="isOverdue()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8"  y1="2" x2="8"  y2="6"/>
            <line x1="3"  y1="10" x2="21" y2="10"/>
          </svg>
          {{ formatDate(task().dueDate) }}
        </span>
      }

      <div class="card-actions">
        <button class="action-btn" type="button"
                (click)="onEdit($event)" aria-label="Edit task">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
        <button class="action-btn action-btn-danger" type="button"
                (click)="onDelete($event)" aria-label="Delete task">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
