@if (isOpen()) {
  <div class="palette-backdrop" (click)="onBackdropClick($event)">
    <div class="palette-container"
         (click)="$event.stopPropagation()"
         (keydown)="onKeydown($event)">

      <!-- Search input -->
      <div class="palette-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" class="search-icon">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          #searchInput
          type="text"
          placeholder="Search tasks, jump anywhere..."
          [value]="searchQuery()"
          (input)="onSearchChange($any($event.target).value)"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="palette-kbd">ESC</kbd>
      </div>

      <!-- Results -->
      <div class="palette-body">
        @if (!hasResults()) {
          <div class="palette-empty">
            <div class="empty-icon">
              <svg width="40" height="40" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </div>
            <h4>No results found</h4>
            <p>Try a different search term</p>
          </div>
        } @else {
          @for (group of groupedCommands(); track group.group) {
            <div class="palette-group">
              <div class="group-label">{{ group.group }}</div>
              @for (cmd of group.commands; track cmd.id) {
                <button
                  class="palette-result"
                  [class.is-selected]="getGlobalIndex(cmd) === selectedIndex()"
                  (click)="onSelect(cmd)"
                  (mouseenter)="selectedIndex.set(getGlobalIndex(cmd))">

                  <!-- Icon -->
                  <div class="result-icon"
                       [style.color]="cmd.iconColor || null">
                    @switch (cmd.icon) {
                      @case ('plus') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <line x1="12" y1="5" x2="12" y2="19"/>
                          <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                      }
                      @case ('check-square') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <polyline points="9 11 12 14 22 4"/>
                          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                      }
                      @case ('folder') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                      }
                      @case ('home') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                          <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                      }
                      @case ('list') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <line x1="8"    y1="6"  x2="21"   y2="6"/>
                          <line x1="8"    y1="12" x2="21"   y2="12"/>
                          <line x1="8"    y1="18" x2="21"   y2="18"/>
                          <line x1="3"    y1="6"  x2="3.01" y2="6"/>
                          <line x1="3"    y1="12" x2="3.01" y2="12"/>
                          <line x1="3"    y1="18" x2="3.01" y2="18"/>
                        </svg>
                      }
                      @case ('trello') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <rect x="3"  y="3" width="18" height="18" rx="2"/>
                          <rect x="7"  y="7" width="3"  height="9"/>
                          <rect x="14" y="7" width="3"  height="5"/>
                        </svg>
                      }
                      @case ('calendar') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <rect x="3" y="4" width="18" height="18" rx="2"/>
                          <line x1="16" y1="2"  x2="16" y2="6"/>
                          <line x1="8"  y1="2"  x2="8"  y2="6"/>
                          <line x1="3"  y1="10" x2="21" y2="10"/>
                        </svg>
                      }
                      @case ('clock') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <circle cx="12" cy="12" r="10"/>
                          <polyline points="12 6 12 12 16 14"/>
                        </svg>
                      }
                      @case ('settings') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <circle cx="12" cy="12" r="3"/>
                          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                      }
                      @case ('log-out') {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round">
                          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                          <polyline points="16 17 21 12 16 7"/>
                          <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                      }
                      @default {
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2">
                          <circle cx="11" cy="11" r="8"/>
                          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                      }
                    }
                  </div>

                  <!-- Content -->
                  <div class="result-content">
                    <div class="result-title">
                      <span [class.is-completed]="cmd.meta?.completed">
                        {{ cmd.title }}
                      </span>
                      @if (cmd.meta?.categoryName && cmd.meta?.categoryColor) {
                        <span class="result-badge"
                              [style.background]="cmd.meta!.categoryColor! + '22'"
                              [style.color]="cmd.meta!.categoryColor">
                          {{ cmd.meta!.categoryName }}
                        </span>
                      }
                      @if (cmd.meta?.priority === 'high') {
                        <span class="priority-dot priority-high" title="High priority"></span>
                      }
                    </div>
                    @if (cmd.subtitle) {
                      <div class="result-subtitle">{{ cmd.subtitle }}</div>
                    }
                  </div>

                  <!-- Shortcut badge -->
                  @if (cmd.shortcut) {
                    <kbd class="palette-kbd palette-kbd-sm">{{ cmd.shortcut }}</kbd>
                  }

                </button>
              }
            </div>
          }
        }
      </div>

      <!-- Footer hints -->
      <div class="palette-footer">
        <div class="hint">
          <kbd class="palette-kbd-tiny">↑</kbd>
          <kbd class="palette-kbd-tiny">↓</kbd>
          <span>navigate</span>
        </div>
        <div class="hint">
          <kbd class="palette-kbd-tiny">↵</kbd>
          <span>select</span>
        </div>
        <div class="hint">
          <kbd class="palette-kbd-tiny">esc</kbd>
          <span>close</span>
        </div>
      </div>

    </div>
  </div>
}
